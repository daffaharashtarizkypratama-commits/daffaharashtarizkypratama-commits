<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="End of transmission" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#160024"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".5" stop-color="#00E5FF"/><stop offset="1" stop-color="#FF003C"/></linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect width="1200" height="220" rx="16"/></clipPath>
</defs>
<style>
  text{font-family:'Fira Code','Courier New',Consolas,monospace}
  .a{font-size:30px;font-weight:700;letter-spacing:6px;fill:#FFFFFF}
  .b{font-size:14px;letter-spacing:4px;fill:#C4B5FD}
  .c{font-size:13px;letter-spacing:3px;fill:#00E5FF}
  .bl{animation:bl 1s infinite steps(1)}
  @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="220" fill="url(#bg)"/>
  <g fill="#8B5CF6" fill-opacity=".35"><path d="M0 150 q150 -40 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V260 H0 Z"><animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="12s" repeatCount="indefinite"/></path></g>
  <g fill="#00E5FF" fill-opacity=".22"><path d="M0 165 q150 -34 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V260 H0 Z"><animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="9s" repeatCount="indefinite"/></path></g>
  <g fill="#FF003C" fill-opacity=".22"><path d="M0 180 q150 -26 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V260 H0 Z"><animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="7s" repeatCount="indefinite"/></path></g>
  <text x="600" y="72" text-anchor="middle" class="a" filter="url(#glow)">END OF TRANSMISSION</text>
  <rect x="380" y="86" width="440" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>
  <text x="600" y="116" text-anchor="middle" class="b">THANK YOU FOR VISITING  //  KEEP LEARNING  //  KEEP BUILDING</text>
  <text x="600" y="142" text-anchor="middle" class="c">THINK  *  BUILD  *  INNOVATE  *  REPEAT</text>
</g>
<rect x="1" y="1" width="1198" height="218" rx="16" fill="none" stroke="#8B5CF6" stroke-opacity=".5" stroke-width="2"/>
</svg>
