<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="GITHUB STATS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F1A"/><stop offset="1" stop-color="#140022"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".5" stop-color="#00E5FF"/><stop offset="1" stop-color="#FF003C"/></linearGradient>
<linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4C0070"/><stop offset="1" stop-color="#00E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".04"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:'Fira Code','JetBrains Mono','Courier New',Consolas,monospace}
.t{font-size:13px;letter-spacing:3px;fill:#00E5FF;font-weight:700}
.tag{font-size:11px;letter-spacing:2px;fill:#8B5CF6}
.lbl{font-size:11px;letter-spacing:2px;fill:#9CA3AF}
.num{font-size:28px;font-weight:700;fill:#FFFFFF}
.big{font-size:40px;font-weight:700;fill:#FFFFFF}
.sm{font-size:12px;fill:#C4B5FD}
.name{font-size:15px;font-weight:700;fill:#FFFFFF}
.desc{font-size:12px;fill:#9CA3AF}
.in{animation:in .7s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<rect x="1" y="1" width="858" height="248" rx="14" fill="url(#bg)" stroke="url(#neon)" stroke-width="2"/>
<circle cx="26" cy="27" r="4" fill="#00FF9C"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="40" y="31" class="t">GITHUB STATS</text>
<text x="836" y="31" class="tag" text-anchor="end">LIVE DATA</text>
<line x1="24" y1="44" x2="836" y2="44" stroke="#8B5CF6" stroke-opacity=".35"/>
<g class="in" style="animation-delay:0.0s"><rect x="17" y="62" width="266" height="66" rx="10" fill="#0D1117" stroke="#8B5CF6" stroke-opacity=".55"/><rect x="17" y="74" width="3" height="42" rx="1.5" fill="#8B5CF6"/><text x="37" y="87" class="lbl">PUBLIC REPOS</text><text x="37" y="116" class="num" style="fill:#8B5CF6">4</text></g><g class="in" style="animation-delay:0.1s"><rect x="297" y="62" width="266" height="66" rx="10" fill="#0D1117" stroke="#FFB800" stroke-opacity=".55"/><rect x="297" y="74" width="3" height="42" rx="1.5" fill="#FFB800"/><text x="317" y="87" class="lbl">TOTAL STARS</text><text x="317" y="116" class="num" style="fill:#FFB800">0</text></g><g class="in" style="animation-delay:0.2s"><rect x="577" y="62" width="266" height="66" rx="10" fill="#0D1117" stroke="#00FF9C" stroke-opacity=".55"/><rect x="577" y="74" width="3" height="42" rx="1.5" fill="#00FF9C"/><text x="597" y="87" class="lbl">TOTAL FORKS</text><text x="597" y="116" class="num" style="fill:#00FF9C">0</text></g><g class="in" style="animation-delay:0.3s"><rect x="17" y="140" width="266" height="66" rx="10" fill="#0D1117" stroke="#00E5FF" stroke-opacity=".55"/><rect x="17" y="152" width="3" height="42" rx="1.5" fill="#00E5FF"/><text x="37" y="165" class="lbl">FOLLOWERS</text><text x="37" y="194" class="num" style="fill:#00E5FF">0</text></g><g class="in" style="animation-delay:0.4s"><rect x="297" y="140" width="266" height="66" rx="10" fill="#0D1117" stroke="#C4B5FD" stroke-opacity=".55"/><rect x="297" y="152" width="3" height="42" rx="1.5" fill="#C4B5FD"/><text x="317" y="165" class="lbl">FOLLOWING</text><text x="317" y="194" class="num" style="fill:#C4B5FD">0</text></g><g class="in" style="animation-delay:0.5s"><rect x="577" y="140" width="266" height="66" rx="10" fill="#0D1117" stroke="#FF003C" stroke-opacity=".55"/><rect x="577" y="152" width="3" height="42" rx="1.5" fill="#FF003C"/><text x="597" y="165" class="lbl">CONTRIBUTIONS</text><text x="597" y="194" class="num" style="fill:#FF00