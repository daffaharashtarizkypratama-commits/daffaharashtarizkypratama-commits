<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="0.8" stop-color="#FF003C"/>
      <stop offset="1" stop-color="#FF003C" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="11" width="1000" height="2" fill="url(#line)" filter="url(#glow)"/>
  <circle r="4" cy="12" fill="#FFFFFF" filter="url(#glow)">
    <animate attributeName="cx" values="50;950;50" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(500 12)" filter="url(#glow)">
    <rect x="-7" y="-7" width="14" height="14" fill="#0D1117" stroke="#00E5FF" stroke-width="2" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" values="45;405" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
