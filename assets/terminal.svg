<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Animated terminal introducing Daffa" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#140022"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#FF003C"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Fira Code', 'Courier New', Consolas, monospace; font-size: 15px; }
    .p  { fill: #00FF9C; }
    .c  { fill: #00E5FF; }
    .v  { fill: #FFFFFF; }
    .m  { fill: #C4B5FD; }
    .r  { fill: #FF003C; }
    .ok { fill: #00FF9C; }
    .l1 { animation: s1 16s infinite; }
    .l2 { animation: s2 16s infinite; }
    .l3 { animation: s3 16s infinite; }
    .l4 { animation: s4 16s infinite; }
    .l5 { animation: s5 16s infinite; }
    .l6 { animation: s6 16s infinite; }
    .cur { animation: blink 1s infinite steps(1); }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes s1 { 0%,2% { opacity: 0 } 3%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    @keyframes s2 { 0%,14% { opacity: 0 } 15%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    @keyframes s3 { 0%,27% { opacity: 0 } 28%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    @keyframes s4 { 0%,40% { opacity: 0 } 41%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    @keyframes s5 { 0%,54% { opacity: 0 } 55%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    @keyframes s6 { 0%,68% { opacity: 0 } 69%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
  </style>

  <!-- window -->
  <rect x="8" y="8" width="844" height="314" rx="14" fill="url(#win)" stroke="url(#neon)" stroke-width="2"/>
  <rect x="8" y="8" width="844" height="38" rx="14" fill="#0D1117"/>
  <rect x="8" y="30" width="844" height="16" fill="#0D1117"/>
  <circle cx="34" cy="27" r="6" fill="#FF003C"/>
  <circle cx="56" cy="27" r="6" fill="#FFB800"/>
  <circle cx="78" cy="27" r="6" fill="#00FF9C"/>
  <text x="430" y="32" text-anchor="middle" class="m" style="font-size:13px">daffa@cyberdeck: ~/profile</text>

  <!-- lines -->
  <g filter="url(#glow)">
    <g class="l1">
      <text x="30" y="82"><tspan class="p">daffa@cyberdeck</tspan><tspan class="m">:</tspan><tspan class="c">~</tspan><tspan class="m">$ </tspan><tspan class="v">whoami</tspan></text>
      <text x="30" y="102" class="c">daffa_harashta_rizky_pratama</text>
    </g>

    <g class="l2">
      <text x="30" y="134"><tspan class="p">daffa@cyberdeck</tspan><tspan class="m">:</tspan><tspan class="c">~</tspan><tspan class="m">$ </tspan><tspan class="v">cat role.txt</tspan></text>
      <text x="30" y="154" class="v">Informatics Engineering Student | Web Developer | AI Enthusiast</text>
    </g>

    <g class="l3">
      <text x="30" y="186"><tspan class="p">daffa@cyberdeck</tspan><tspan class="m">:</tspan><tspan class="c">~</tspan><tspan class="m">$ </tspan><tspan class="v">ls stack/</tspan></text>
      <text x="30" y="206" class="c">php  laravel  vue  tailwind  mysql  java  python  flutter  esp32</text>
    </g>

    <g class="l4">
      <text x="30" y="238"><tspan class="p">daffa@cyberdeck</tspan><tspan class="m">:</tspan><tspan class="c">~</tspan><tspan class="m">$ </tspan><tspan class="v">git log --oneline -1</tspan></text>
      <text x="30" y="258"><tspan class="r">a1b2c3d</tspan><tspan class="v"> feat: never stop learning, never stop building</tspan></text>
    </g>

    <g class="l5">
      <text x="30" y="290"><tspan class="p">daffa@cyberdeck</tspan><tspan class="m">:</tspan><tspan class="c">~</tspan><tspan class="m">$ </tspan><tspan class="v">./status.sh</tspan></text>
    </g>

    <g class="l6">
      <text x="440" y="290"><tspan class="ok">[OK]</tspan><tspan class="v"> curiosity  </tspan><tspan class="ok">[OK]</tspan><tspan class="v"> coffee  </tspan><tspan class="r">[!!]</tspan><tspan class="v"> sleep</tspan><tspan class="cur c"> █</tspan></text>
    </g>
  </g>

  <rect x="8" y="8" width="844" height="314" rx="14" fill="url(#scan)"/>
</svg>
