<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Daffa Harashta Rizky Pratama - Informatics Engineering, Web Developer, AI Enthusiast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#160024"/>
      <stop offset="1" stop-color="#001F35"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#FF003C"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Fira Code', 'Courier New', Consolas, monospace; }
    .name { font-size: 50px; font-weight: 700; letter-spacing: 1px; }
    .sub  { font-size: 17px; letter-spacing: 5px; fill: #00E5FF; }
    .tag  { font-size: 13px; letter-spacing: 3px; fill: #00FF9C; }
    .foot { font-size: 16px; fill: #C4B5FD; }
    .g1 { animation: glitch1 3.2s infinite steps(1); }
    .g2 { animation: glitch2 3.2s infinite steps(1); }
    .blink { animation: blink 1s infinite steps(1); }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .scanbar { animation: sweep 5s linear infinite; }
    .row1 { animation: row 3s ease-in-out infinite; }
    .row2 { animation: row 3s ease-in-out infinite 0.5s; }
    .row3 { animation: row 3s ease-in-out infinite 1s; }
    .row4 { animation: row 3s ease-in-out infinite 1.5s; }
    .row5 { animation: row 3s ease-in-out infinite 2s; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    @keyframes row { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
    @keyframes sweep { from { transform: translateY(-40px) } to { transform: translateY(360px) } }
    @keyframes glitch1 {
      0%, 88%, 100% { transform: translate(0,0); opacity: 0 }
      89% { transform: translate(-6px,-2px); opacity: .9 }
      91% { transform: translate(5px,2px);  opacity: .9 }
      93% { transform: translate(-3px,0);   opacity: .9 }
      95% { transform: translate(0,0);      opacity: 0 }
    }
    @keyframes glitch2 {
      0%, 88%, 100% { transform: translate(0,0); opacity: 0 }
      90% { transform: translate(6px,2px);   opacity: .9 }
      92% { transform: translate(-5px,-2px); opacity: .9 }
      94% { transform: translate(3px,0);     opacity: .9 }
      96% { transform: translate(0,0);       opacity: 0 }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- background -->
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>

    <!-- perspective grid -->
    <g stroke="#8B5CF6" stroke-width="1" fill="none" opacity="0.55">
      <line x1="600" y1="190" x2="-300" y2="320"/>
      <line x1="600" y1="190" x2="-60"  y2="320"/>
      <line x1="600" y1="190" x2="180"  y2="320"/>
      <line x1="600" y1="190" x2="390"  y2="320"/>
      <line x1="600" y1="190" x2="600"  y2="320"/>
      <line x1="600" y1="190" x2="810"  y2="320"/>
      <line x1="600" y1="190" x2="1020" y2="320"/>
      <line x1="600" y1="190" x2="1260" y2="320"/>
      <line x1="600" y1="190" x2="1500" y2="320"/>
    </g>
    <g stroke="#00E5FF" stroke-width="1.2">
      <line class="row1" x1="0" y1="205" x2="1200" y2="205"/>
      <line class="row2" x1="0" y1="222" x2="1200" y2="222"/>
      <line class="row3" x1="0" y1="243" x2="1200" y2="243"/>
      <line class="row4" x1="0" y1="268" x2="1200" y2="268"/>
      <line class="row5" x1="0" y1="298" x2="1200" y2="298"/>
    </g>

    <!-- floating particles -->
    <g fill="#00E5FF">
      <circle cx="120" cy="60" r="2"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="110" r="1.5"><animate attributeName="cy" values="110;90;110" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2;1" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="50" r="2"><animate attributeName="cy" values="50;70;50" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="120" r="1.5"><animate attributeName="cy" values="120;100;120" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2;1" dur="5.5s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#FF003C">
      <circle cx="210" cy="150" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="990" cy="160" r="2"><animate attributeName="opacity" values="1;0.1;1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="40" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- status tag -->
    <circle cx="46" cy="40" r="5" fill="#00FF9C" class="pulse"/>
    <text x="62" y="45" class="tag">SYSTEM ONLINE</text>
    <text x="1154" y="45" class="tag" text-anchor="end" fill="#8B5CF6" style="fill:#8B5CF6">v2.0 // DARK CYBER</text>

    <!-- name (glitch layers) -->
    <text x="600" y="130" text-anchor="middle" class="name g1" fill="#FF003C">DAFFA HARASHTA RIZKY PRATAMA</text>
    <text x="600" y="130" text-anchor="middle" class="name g2" fill="#00E5FF">DAFFA HARASHTA RIZKY PRATAMA</text>
    <text x="600" y="130" text-anchor="middle" class="name" fill="#FFFFFF" filter="url(#glow)">DAFFA HARASHTA RIZKY PRATAMA</text>

    <!-- neon underline -->
    <rect x="200" y="148" width="800" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>

    <!-- subtitle -->
    <text x="600" y="184" text-anchor="middle" class="sub">INFORMATICS ENGINEERING  //  WEB DEVELOPER  //  AI</text>

    <!-- footer prompt -->
    <text x="600" y="296" text-anchor="middle" class="foot">&gt; think. build. innovate.<tspan class="blink" fill="#00E5FF">_</tspan></text>

    <!-- scanlines + sweep -->
    <rect width="1200" height="320" fill="url(#scan)"/>
    <rect class="scanbar" x="0" y="0" width="1200" height="40" fill="#00E5FF" opacity="0.06"/>

    <!-- corner brackets -->
    <g stroke="url(#neon)" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M16 56 V16 H56"/>
      <path d="M1184 56 V16 H1144"/>
      <path d="M16 264 V304 H56"/>
      <path d="M1184 264 V304 H1144"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="16" fill="none" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="2"/>
</svg>
