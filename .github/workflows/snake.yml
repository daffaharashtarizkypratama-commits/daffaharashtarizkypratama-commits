name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # otomatis update tiap 12 jam
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-cyber.svg?color_snake=#00E5FF&color_dots=#161B22,#2D0A4E,#4C0070,#8B5CF6,#C4B5FD
            dist/github-snake.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
